name: quality gate

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gate:
    # ⛔ TWO OPERATING SYSTEMS, AND THAT IS X-1 OF THE 2026-08-27 AUDIT. ADR-0002 says "we develop
    # and test on Windows", and until this commit CI ran on Linux alone -- while `platform` is the
    # crate that actually touches the OS, and since sub-project 2 the `ipc` transport there has two
    # halves. The owner decided A on 2026-09-09 (decision 44 of the GUI north star, in its table of
    # the OWNER's decisions): a matrix, the SAME gate on both.
    # ⚠️ The north star numbers the owner's table and the coordinator's table with the same sequence,
    # so every decision cited in this file names its table. RECALL OF 2026-10-09 -- audit of
    # 2026-09-30, AUD-1128.
    strategy:
      # ⛔ `fail-fast: false` IS NOT A DETAIL. By default GitHub CANCELS the other jobs of a matrix
      # at the first red, so a red on Linux would hide the state of Windows -- which is exactly the
      # half X-1 exists to look at.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml declares version and target: rustup installs them by itself,
      # and that is why constraint 4 of §11 does not require a step here.
      - run: rustup show
      # ⛔ X-3: NEITHER IMAGE SHIPS `cargo audit`, AND THIS BUILDS IT FROM SOURCE, which costs
      # minutes per job -- more on the Windows runner than on the Linux one. No figure is written
      # here: the step's `startedAt` and `completedAt` on each runner are in
      # `gh run view <run-id> --json jobs`. RECALL OF 2026-10-09 -- audit of 2026-09-30, AUD-1129.
      # That cost is accepted rather than avoided with a third-party action that downloads a
      # prebuilt binary: minutes are free here (the repository is public, read from the GitHub API
      # on 2026-09-15 -- the same premise the owner's decision 44 used for the matrix), and a third
      # party in CI's trust path runs with the repository token. The other way is REGISTERED AND
      # NOT TAKEN: if wall time ever becomes a MEASURED problem, it is the owner's decision.
      # ⚠️ AND THAT TOKEN'S SCOPE IS NOT SET IN THIS FILE: there is no `permissions:` key, and
      # `actions/checkout` keeps the token in the job's git config, `persist-credentials` being
      # true by default. It is read-only today by the REPOSITORY's default -- `gh api
      # repos/devfrx/daemon/actions/permissions/workflow`, read on 2026-10-09 -- and writing it
      # here is an open choice. RECALL OF 2026-10-09 -- audit of 2026-09-30, AUD-2124.
      - run: cargo install cargo-audit --locked --version 0.22.2
      # Node for the web step of the gate. `node-version-file` reads `engines.node` from the
      # manifest, so the version lives in ONE house (the coordinator's decision 46): re-read at the
      # action's own docs on 2026-09-15, whose example uses an OR range exactly like ours, and the
      # file is resolved relative to the repository root.
      # ⚠️ THE RANGE IS A FLOOR, NOT A PIN, AND THE RUNNER IMAGE PICKS INSIDE IT: with `check-latest`
      # at its default the action takes a version the image's tool cache already holds, if one
      # satisfies the range ("The action will first check the local cache for a semver match", its
      # README, read on 2026-10-09) -- so the Node CI runs changes when the image does, with no
      # commit of ours. Every run prints it in this step's "Environment details". Declared and not
      # chosen, as gotcha #130 asks of an accident like `package-manager-cache` and `shell` below;
      # pinning it is an open choice. RECALL OF 2026-10-09 -- audit of 2026-09-30, AUD-733.
      #
      # ⛔ `package-manager-cache: false` IS WRITTEN OUT, and that is the point of the line. The
      # input defaults to `true` in v7.0.0 and switches caching on only when the manifest declares
      # `packageManager` or `devEngines.packageManager` -- ours declares neither, so the
      # coordinator's decision 47 ("no npm cache today") would hold BY ACCIDENT. The day somebody
      # adds that field the action would look for the lockfile at the REPOSITORY ROOT, where ours
      # is not -- ours is `gui/package-lock.json` -- and CI would go red for a reason nobody chose.
      # This line is not the one that decision defers: `cache: npm` would switch caching ON, this
      # one declares it off.
      - uses: actions/setup-node@v7
        with:
          node-version-file: gui/package.json
          package-manager-cache: false
      - run: bash scripts/gate.sh
        # ⛔ `shell: bash` IS WRITTEN OUT, for the same reason as `package-manager-cache` above. The Windows
        # image ships THREE executables named `bash` -- Git's, MSYS2's and WSL's C:\Windows\System32\bash.exe
        # (runner-images Windows2025 readme, read on 2026-09-22) -- and a bare `bash` under the default `pwsh`
        # is whichever PATH finds first, an order nobody here chose. With `shell: bash` the workflow syntax
        # says "the bash shell included with Git for Windows is used" (read on 2026-09-22), and on Linux it is
        # the same bash as before. The owner's decision 44 asked that Git Bash launch the gate: this line says
        # so (E207).
        shell: bash
