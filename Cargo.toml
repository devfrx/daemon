[workspace]
resolver = "3"
members = [
    "crates/kernel",
    "crates/platform",
    "crates/secrets",
    "crates/simulator",
    "crates/daemon",
]
# spikes/ is NOT a member: spikes/rust/ is a nested workspace and carries a clippy.toml
# that, at workspace level, would fire at platform, which MUST call the clock and the
# filesystem. Constraint 5 of §11, decided in §7.4.4.
exclude = ["spikes"]

[workspace.package]
edition = "2024"
version = "0.0.0"
publish = false
