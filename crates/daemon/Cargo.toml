version.workspace = true
publish.workspace = true

[dependencies]
kernel = { path = "../kernel" }
platform = { path = "../platform" }
secrets = { path = "../secrets" }
# ⛔ NON dipende da `simulator`. Il daemon è il cablaggio DI PRODUZIONE: monta `platform`.
