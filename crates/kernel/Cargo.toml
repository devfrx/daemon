[package]
name = "kernel"
edition.workspace = true
version.workspace = true
publish.workspace = true

# ⛔ EVERY ENTRY HERE IS A LINE OF THE ADR-0031 LIST, and adding one is a deliberate and
# reviewable act. The justification is written next to it, not elsewhere: the single home
# of the list is §7.3.1 of the spec, and this manifest mirrors it.
# The check that verifies them is scripts/gate-deps.sh, on the TWO graphs.
[dependencies]

# Serializes the schema of the private `ipc` channel (I4). Reaches: NOTHING — it builds for
# a target without an OS, and no source of randomness appears in the graph.
# ⛔ PINNED TO "2" AND NOT TO "3": 3.0.0 is the last published version and its entire source
# is `compile_error!("https://xkcd.com/2347/")`, a placeholder against name squatting.
# Without this pin, the next update "fixes" the constraint and breaks the build.
# Gotcha #22, constraint 3 of §11.
#
# ⚠️ REGISTERED 2026-08-18, NOT DECIDED — finding C-1 of the audit. `bincode` 2.0.1 is covered by
# RUSTSEC-2025-0141, "Bincode is unmaintained", issued 2026-01-07. It is category INFO: NOT a
# vulnerability, and the other seven dependencies are clean (checked on OSV.dev).
#
# ⛔ IT IS THE HOLE BETWEEN TWO CRITERIA, and that is the part worth remembering. ADR-0037 asks
# "does the PEER have a conformant and MAINTAINED reader?" — pointed at the far end of the wire,
# TypeScript, measure M-11. M-1 pointed at us and asked something else: "is the transitive graph
# acceptable for I3?". NEITHER asks whether the library at OUR end is still maintained, and
# gate-deps.sh checks WHICH crates are here, not HOW THEY ARE. The advisory was public SEVEN
# MONTHS before §6.1.1 was reconfirmed on 2026-08-08, and nobody saw it.
#
# ✅ ACTING COSTS ALMOST NOTHING TODAY AND THE COST GROWS BY ITSELF: measured 2026-08-18, this
# crate has ZERO production uses of `bincode` — one doc comment in `src/ports/ipc.rs` and one
# probe in `tests/dependencies_usable.rs`. The `ipc` schema is Milestone 6. It is a window that
# closes on its own, like the fourth property of §3 of the compendium: DECIDE AT MILESTONE 6,
# while the choice is still free.
bincode = { version = "2", default-features = false, features = ["alloc", "derive"] }

# ⚠️ `unty` 0.0.4 is NOT declared here, and that is deliberate: it arrives as a dependency
# of `bincode`, and declaring it directly would create an unused entry. It is ON THE LIST
# in scripts/gate-deps.sh all the same, because the check measures the TRANSITIVE graph —
# the danger arrives on the bounce, and that is the reason ADR-0031 does not look at direct
# dependencies alone.

# Encodes the durable journal record, by explicit index (§4.9, ADR-0036), AND the schema of
# the channel towards the workers (§6.10, ADR-0037). A single entry for two artefacts: the
# channel reuses an already shipped entry, and the list does NOT grow.
minicbor = { version = "2.3.0", default-features = false, features = ["alloc", "derive"] }

[dev-dependencies]
trybuild = "1"

# ⚠️ DEV-dependency, not a shipped one: `gate-deps.sh` measures the shipped graph with
# `-e normal,no-proc-macro`, so this does not enter the ADR-0031 list. Verified by
# running the gate, not deduced — gotcha #41.
#
# ⚠️ AND IT CLOSES A CYCLE, `kernel -> (dev) -> simulator -> kernel`. Cargo accepts it
# because a dev-dependency does not take part in building the library; it was still run
# once rather than assumed. The test lives here and not in `simulator/tests/` because what
# it proves is THE KERNEL'S EXECUTOR under a fake reactor.
simulator = { path = "../simulator" }
