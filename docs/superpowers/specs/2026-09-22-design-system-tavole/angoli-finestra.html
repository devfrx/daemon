/* ===== proposta/base.css ===== */
/* EVERYTHING THAT IS NOT A COLOUR -- design system, section (a), 2026-09-23. One set for both themes.
   Sizes in rem (WCAG 1.4.4: text scales with the root), hairlines in px. Sources in the design document. */
:root {
  --font-family-text: "Geist Variable", system-ui, sans-serif;
  --font-family-tool: "Barlow", "Bahnschrift", system-ui, sans-serif;
  --font-family-mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  --font-weight-light: 300;
  --font-weight-regular: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;

  /* the type roles, as `font` shorthands: weight size/line family. Lines on the 4 px grid. */
  --font-label: var(--font-weight-semibold) 0.6875rem/1rem var(--font-family-tool);     /* 11/16, UPPERCASE */
  --tracking-label: 0.14em;
  --font-caption: var(--font-weight-regular) 0.75rem/1rem var(--font-family-text);      /* 12/16 */
  --font-body: var(--font-weight-regular) 0.875rem/1.25rem var(--font-family-text);     /* 14/20 */
  --font-body-strong: var(--font-weight-semibold) 0.875rem/1.25rem var(--font-family-text);
  --font-title: var(--font-weight-semibold) 1rem/1.5rem var(--font-family-text);        /* 16/24 */
  --font-heading: var(--font-weight-semibold) 1.25rem/1.75rem var(--font-family-text);  /* 20/28 */
  --font-numeric: var(--font-weight-medium) 0.875rem/1.25rem var(--font-family-tool);   /* 14/20, tabular */
  --font-display: var(--font-weight-light) 2rem/2.5rem var(--font-family-tool);         /* 32/40, tabular */
  --font-mono: var(--font-weight-regular) 0.8125rem/1.25rem var(--font-family-mono);    /* 13/20 */

  /* space: the 4 px grid */
  --space-0-5: 2px;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;

  /* radii: OUTER = INNER + DISTANCE, by construction (answer 4) */
  --radius-inline: 6px;
  --radius-control: 8px;
  --radius-card: calc(var(--radius-control) + var(--space-3));   /* 20 */
  --radius-frame: calc(var(--radius-card) + var(--space-3));     /* 32 */
  --radius-full: 9999px;

  /* sizes: nothing clickable under 24 x 24 (WCAG 2.5.8) */
  --size-target-min: 24px;
  --size-control-sm: 24px;
  --size-control-md: 32px;
  --size-control-lg: 40px;   /* the big grab of SP-8, move 5 */
  --size-icon-sm: 14px;
  --size-icon-md: 16px;
  --size-icon-lg: 20px;
  --icon-stroke: 2;
  --border-width: 1px;
  --focus-width: 2px;        /* WCAG 2.4.13: a 2 px perimeter */
  --focus-offset: 2px;

  /* motion: Carbon's productive durations and curves */
  --duration-fast: 110ms;
  --duration-moderate: 240ms;
  --duration-slow: 400ms;
  --ease-standard: cubic-bezier(0.2, 0, 0.38, 0.9);
  --ease-enter: cubic-bezier(0, 0, 0.38, 0.9);
  --ease-exit: cubic-bezier(0.2, 0, 1, 0.9);

  /* layers */
  --z-popover: 100;
  --z-overlay: 200;
  --z-toast: 300;
  --z-tooltip: 400;
}

/* WCAG 2.3.3: motion that an interaction triggers can be turned off -- Windows' own switch. */
@media (prefers-reduced-motion: reduce) {
  :root {
    --duration-fast: 0ms;
    --duration-moderate: 0ms;
    --duration-slow: 0ms;
  }
}

body {
  background: var(--color-bg);
  color: var(--color-text);
  font: var(--font-body);
}

/* WCAG 2.4.7 and 2.4.13: an OUTLINE and not a box-shadow, because Windows' high contrast keeps outlines. */
:focus-visible {
  outline: var(--focus-width) solid var(--color-focus);
  outline-offset: var(--focus-offset);
}

::selection {
  background: var(--color-bg-selection);
  color: var(--color-text);
}

/* ===== proposta/themes.css ===== */
/* THE COLOURS OF THE SPA, in two layers -- design system, section (a), 2026-09-23.
   Layer 1, `--ref-*`: five TONAL PALETTES, each stop named by its tone (CIE L*, Material's HCT tone).
   ⛔ No component reads a `--ref-*`: components read ROLES, so a theme can never be bypassed.
   Layer 2, `--color-*` and `--shadow-*`: the ROLES, the same names in both themes, property first
   (bg / text / border), then role, then state. Every text role reads 4.5:1 on every background role
   and every non-text role 3:1 -- the pairs are listed in the contrast test, not here. */
:root {
  --ref-neutral-5: #151112; --ref-neutral-8: #1B1718; --ref-neutral-12: #241F20; --ref-neutral-15: #2A2425; --ref-neutral-17: #2F2829; --ref-neutral-19: #342D2D; --ref-neutral-39: #655B57; --ref-neutral-44: #6F6660; --ref-neutral-48: #7A706A; --ref-neutral-52: #847A73; --ref-neutral-64: #A39A8F; --ref-neutral-85: #DCD2C4; --ref-neutral-87: #E2D9CC; --ref-neutral-89: #E6DFD2; --ref-neutral-91: #ECE6DA; --ref-neutral-94: #F3EEE6; --ref-neutral-96: #F7F2EA; --ref-neutral-98: #FBF8F3;
  --ref-bordeaux-12: #2F1B1D; --ref-bordeaux-14: #371C1F; --ref-bordeaux-24: #711627; --ref-bordeaux-28: #7A1F2E; --ref-bordeaux-31: #862837; --ref-bordeaux-50: #BF5567; --ref-bordeaux-72: #E59EA1; --ref-bordeaux-81: #DFC2C0; --ref-bordeaux-86: #E8D4D0; --ref-bordeaux-91: #EFE1DD;
  --ref-green-17: #292A26; --ref-green-28: #264B22; --ref-green-38: #3D6339; --ref-green-41: #43693F; --ref-green-69: #8DB38A; --ref-green-80: #AAD0A6; --ref-green-92: #E7E9E0;
  --ref-amber-17: #312820; --ref-amber-28: #5D3B01; --ref-amber-38: #7C510A; --ref-amber-42: #8A5A0B; --ref-amber-71: #D9A441; --ref-amber-80: #F4BE5D; --ref-amber-92: #F0E7DD;
  --ref-red-16: #332321; --ref-red-28: #811B07; --ref-red-38: #A82A13; --ref-red-42: #B4361F; --ref-red-60: #E26D5A; --ref-red-64: #EF7965; --ref-red-80: #FBB6A8; --ref-red-92: #F6E5DD;
}

/* ===== the board: only tokens, except the page background and the drawn Windows glyphs ===== */
*{box-sizing:border-box}
html{background:#0d0b0b}
body{margin:0;padding:var(--space-8) var(--space-6);font:var(--font-body);color:#efe9df}
.board{max-width:1392px;margin:0 auto;display:flex;flex-direction:column;gap:var(--space-6)}
.intro h1{font:var(--font-heading);margin:0 0 var(--space-2)}
.intro p{margin:0;max-width:880px;color:#cfc6bb}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(648px,1fr));gap:var(--space-6)}
.sheet{background:var(--color-bg-fill);color:var(--color-text);border-radius:calc(var(--radius-card) + var(--space-6));padding:var(--space-6)}
.sheet h2{font:var(--font-title);margin:0 0 var(--space-4)}
.figs{display:flex;flex-direction:column;gap:var(--space-8)}
.fig{margin:0;display:flex;flex-direction:column;gap:var(--space-3)}
.fig figcaption{display:flex;flex-direction:column;gap:var(--space-1)}
.note{font:var(--font-caption);color:var(--color-text-muted);max-width:600px}
.note b{color:var(--color-text);font-weight:var(--font-weight-semibold)}
.lab{display:inline-flex;align-items:center;gap:var(--space-2);font:var(--font-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--color-text-muted)}
.lab svg.i{width:var(--size-icon-sm);height:var(--size-icon-sm);color:var(--color-mark);flex:none}

/* the window: its corner is Windows', 8 px (Microsoft Learn, Geometry in Windows 11) */
.win{position:relative;width:600px;max-width:100%;height:340px;border-radius:8px;overflow:hidden;background:var(--color-bg);
  box-shadow:0 0 0 var(--border-width) var(--color-border-strong),var(--shadow-overlay)}
.bar{display:flex;align-items:center;gap:var(--space-3);height:var(--space-12);padding-left:var(--space-4)}

.dock{position:absolute;left:var(--space-3);right:var(--space-3);top:calc(var(--space-12) + var(--space-3));display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:var(--space-3)}

.card{position:relative;border-radius:var(--radius-card);background:var(--color-bg-surface);border:var(--border-width) solid var(--color-border-card);
  box-shadow:var(--shadow-card);padding:var(--space-3) var(--space-4)}

  border-radius:var(--radius-full);background:var(--color-bg-fill);color:var(--color-text);font:var(--font-label);letter-spacing:var(--tracking-label);text-transform:uppercase;white-space:nowrap}

<body>
<!-- The board of the second question of section (d) of the design-system brainstorming, 2026-09-23 (fourth
     session): where the strip goes, now that the window's corners are Windows' (8 px, 0 when maximized) and not
     ours. The owner chose A, answer 20. Tokens copied from token.html; icons from panoramica.html, with Lucide's
     licence above. PROBED BEFORE IT WAS SHOWN, in both directions: sonda-raggi.js flags ONLY the "Com'era" strip,
     its four bottom corners (r20/R8 at 12 and 12), and passes A and B, with its own roots and with `.sheet`;
     sonda-icone.js 21 of 21 centred per theme; nothing clipped, nothing sticking out, at 1168, 1440 and 800 px.
     The generator lived in the fourth session's scratchpad, gen_striscia.py; the diary is
     docs/superpowers/specs/2026-09-22-design-system-design.md. -->
<div class="board">
  <div class="intro">
    <h1>La striscia e gli angoli della finestra</h1>
    <p>Nella finestra vera gli angoli li disegna Windows: 8 px, e dritti quando è ingrandita. Qui la stessa finestra, a grandezza vera, con la striscia in tre modi. Guarda gli angoli in basso. Scelta: <b>A</b>, alla risposta 20 del brainstorming.</p>
  </div>
  <div class="cols ds">
  <section class="sheet fp" data-theme="dark" data-name="scuro" data-text="Geist Variable" data-tool="Barlow">
    <h2>Tema scuro</h2>
    <div class="figs">
    <figure class="fig">
      <div class="m win v-was">
