[package]
name = "fake-core"
edition = "2024"
version = "0.0.0"
publish = false

# ⛔ A TOOL, NOT A SPIKE, and that is why the lockfile is committed: `scripts/gate-gui.sh` WILL run
# `cargo test --locked --manifest-path gui/fake-core/Cargo.toml`, and `--locked` needs a lockfile
# somebody approved. A spike's lockfile is ignored because a spike is redone from a seed.
# ⚠️ FUTURE TENSE ON PURPOSE (E120): that script is TASK 15 and does not exist yet -- `ls scripts/`
# says so. A comment that justifies an item by naming a consumer writes it in the future until the
# consumer is there, which is E34 in its general form.
[dependencies]
kernel = { path = "../../crates/kernel" }
platform = { path = "../../crates/platform" }
# ⛔ DEPENDS ON `simulator`, unlike the daemon -- and the asymmetry is the point. The daemon is
# the PRODUCTION wiring and mounts `platform`; this is a TOOL that mounts the in-memory ports so
# that nothing it does survives the run (§7: "non persiste nulla oltre la corsa").
simulator = { path = "../../crates/simulator" }

# ⛔ THE PROBES NEED A PEER, and a peer speaks the transport directly. The version is the one
# `crates/platform/Cargo.toml` pins -- READ WITH `grep`, never from memory -- because two versions
# of a transport at the two ends of one socket is a bug nobody would look for. That is what this
# line buys, and the versions do match.
# ⚠️ `default-features = false` IS INERT TODAY, and it is declared rather than left to be believed
# (E121): `platform` pulls `interprocess` with its defaults and cargo unifies features across the
# graph -- `cargo tree -e features` prints `interprocess feature "default"`. ⛔ IT IS KEPT AS A
# DECLARATION OF WHAT THIS CRATE NEEDS ON ITS OWN, so that the day `platform` stops pulling the
# transport the probes do not silently gain the defaults. ⚠️ THE FIRST REASON WRITTEN HERE WAS
# FALSE and is gone: it said dropping the line would drag the lockfile. Measured 2026-09-21 --
# line removed, `cargo build --tests` rebuilt, `cmp` of `Cargo.lock` SILENT. An excuse that a
# command falsifies is worse than no excuse.
# ⚠️ Manifest and `Cargo.lock` in the SAME commit: the gate passes `--locked` (finding G-5).
[dev-dependencies]
interprocess = { version = "2.4.4", default-features = false }
